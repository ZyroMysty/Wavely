[package]
name = "wavely-native"
version = "0.17.0-native.2"
edition = "2021"

[[bin]]
name = "wavely-native"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"
serde_json = "1"
winresource = "0.1"

[dependencies]
# Oberfläche ohne Browser: Software-Renderer (kein Grafiktreiber-Speicher)
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
raw-window-handle = "0.6"
windows-numerics = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "net", "io-util"] }
reqwest = "0.12"
rustypipe = { path = "../src-tauri/vendor/rustypipe", features = ["userdata"] }
rand = "0.9"
sha1 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
# Audio: Dekodieren und Ausgabe
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "mkv", "ogg", "vorbis", "wav", "pcm", "opt-simd"] }
symphonia-adapter-opus-rs = "0.1"
cpal = "0.18"
# Lokale Musik: Tags lesen, Ordner durchsuchen und beobachten, Ordnerauswahl
lofty = "0.25"
minisign-verify = "0.3"
semver = "1"
arboard = { version = "3", default-features = false }
md-5 = "0.11"
url = "2"
base64 = "0.22"
percent-encoding = "2"
discord-rich-presence = "1.1"
walkdir = "2.5"
notify-debouncer-mini = "0.7"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
# Browserfenster nur bei Bedarf (Anmeldungen, Spotify-Wiedergabe)
wry = { version = "0.57", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
