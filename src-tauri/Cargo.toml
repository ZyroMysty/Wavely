[package]
name = "wavely"
version = "0.7.0"
edition = "2021"

[lib]
name = "wavely_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "1.1.0"
lofty = "0.25"
walkdir = "2.5"
base64 = "0.22"
rustypipe = { version = "0.11.4", features = ["userdata"] }
tokio = { version = "1.54.0", features = ["macros", "process", "sync", "time"] }
reqwest = "0.12"
percent-encoding = "2"
sha1 = "0.10"
rand = "0.9"
sha2 = "0.10"

# Kleine Release-Binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }

# Lokale Kopie von RustyPipe mit Korrekturen fÃ¼r aktuelle YouTube-Music-Antworten (siehe vendor/README.md)
[patch.crates-io]
rustypipe = { path = "vendor/rustypipe" }

# Windows-Taskleiste (Vorschau-Buttons), gleiche Version wie Tauri
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
