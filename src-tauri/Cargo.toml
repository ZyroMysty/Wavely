[package]
name = "ytmusic-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "ytmusic_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
discord-rich-presence = "0.2.5"

# Kleine Release-Binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
